name: Process inquiry emails
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: inquiry-email-worker
  cancel-in-progress: false
jobs:
  drain:
    if: github.ref == 'refs/heads/main' && vars.EMAIL_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Drain a bounded batch of pending notifications
        env:
          EMAIL_WORKER_URL: ${{ vars.EMAIL_WORKER_URL }}
          EMAIL_WORKER_SECRET: ${{ secrets.EMAIL_WORKER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EMAIL_WORKER_URL" != https://*/api/internal/email || ${#EMAIL_WORKER_SECRET} -lt 32 ]]; then
            echo "Configure the HTTPS worker URL and worker secret."
            exit 1
          fi
          curl --silent --show-error --fail --max-time 180 \
            --request POST \
            --header "Authorization: Bearer $EMAIL_WORKER_SECRET" \
            "$EMAIL_WORKER_URL"
