<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08151d"/><stop offset="1" stop-color="#201333"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#365563" stroke-opacity=".22"/></pattern></defs><style>text{font-family:Arial,sans-serif}.eyebrow{fill:#35e3f6;font-size:18px;letter-spacing:2px}.title{fill:#e6faff;font-size:48px;font-weight:700}.sub{fill:#abc0cb;font-size:20px}.label{fill:#e6faff;font-size:26px;font-weight:700}.code{fill:#35e3f6;font-family:monospace;font-size:20px}.panel{fill:#101d2b;stroke:#557080;stroke-width:2}.line{fill:none;stroke:#557080;stroke-width:3}.connector{fill:none;stroke:#a68aff;stroke-width:4}</style><rect width="1200" height="675" rx="24" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><text x="72" y="92" class="eyebrow">THE PUBLISHING FLOW</text><text x="72" y="175" class="title">Your draft. Your decision.</text><text x="72" y="220" class="sub">Saving an idea should never publish it by surprise.</text><path d="M370 420H450 M750 420H830" class="connector"/><rect x="70" y="310" width="300" height="230" rx="20" class="panel"/><rect x="450" y="310" width="300" height="230" rx="20" class="panel"/><rect x="830" y="310" width="300" height="230" rx="20" class="panel"/><text x="100" y="365" class="eyebrow">01 / PRIVATE</text><text x="100" y="425" class="label">Write a draft</text><text x="100" y="475" class="sub">Room to experiment.</text><text x="480" y="365" class="eyebrow">02 / REVIEW</text><text x="480" y="425" class="label">Preview it</text><text x="480" y="475" class="sub">Read before you share.</text><text x="860" y="365" class="eyebrow">03 / PUBLIC</text><text x="860" y="425" class="label">Publish</text><text x="860" y="475" class="sub">Share the saved version.</text><text x="72" y="610" class="sub">Later draft edits stay private until you publish again.</text></svg>